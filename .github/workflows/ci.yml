name: CI

# Runs the exact same lanes as engine/check.sh on every PR and push to main.
# Core/default and distributed feature builds execute on separate runners; the
# long-lived `gate + benchmarks` status requires both, preserving one required
# gate without serializing unlike feature builds. ADR-124's reviewed performance
# contract stays on its pinned core runner. Deep benchmarks remain exploratory.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_soak:
        description: "Also run the ignored 10M-query soak test (slow, multi-GiB RAM)"
        type: boolean
        default: false

# A newer push to the same branch/PR cancels the in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep the build inside the workspace so Swatinem/rust-cache can cache it.
  # check.sh respects an externally-set CARGO_TARGET_DIR (defaults to /tmp
  # locally), so this just redirects it for CI without changing the script.
  CARGO_TARGET_DIR: ${{ github.workspace }}/engine/target
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  core-gate:
    name: core gate + benchmarks
    # ADR-124 runner contract: public standard x64 = 4 vCPU / 16 GiB. Do not
    # float this to `ubuntu-latest`; changing the label requires an intentional
    # five-run rebaseline.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      # Materialize the toolchain pinned in engine/rust-toolchain.toml (rustup
      # auto-installs it, with the rustfmt + clippy components, on first use).
      - name: Install pinned toolchain
        working-directory: engine
        run: rustc --version && cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
          # Preserve the cache namespace used by the former `gate` job after
          # renaming the execution job to `core-gate`.
          shared-key: gate

      # Prebuilt binaries — far faster than `cargo install` from source.
      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      # The core half of the must-pass gate: fmt + default/lean clippy +
      # cargo test --release (including stress/pressure) + audit + deny +
      # reference independence + crash injection. The distributed half runs
      # concurrently below; the final gate job requires both results.
      - name: check.sh (core lane)
        run: ./engine/check.sh --lane core

      # The Tier 5 M1 deployable smoke (ADR-098): run → ingest → search → restart →
      # search again → restore, over the release bin, for BOTH local modes
      # (single-node + in-process cluster). A deployment gate over the built
      # artifact like the harness job — check.sh stays the engine-gate SSOT.
      # check.sh's test build has already compiled the deps, so this build is
      # roughly a link step.
      - name: Build the server bin (release, default features)
        working-directory: engine
        run: cargo build --release --bin server

      - name: Local deploy smoke (single-node + in-process cluster)
        run: ./deploy/local-smoke.sh --prebuilt engine/target/release

      # The merge-blocking performance subset: fixed seed/workload, exact
      # structural checks, 5% memory + durable-footprint ceilings, absolute
      # timing safety limits, and (once fresh history is populated) timing
      # medians compared with max(30%, 3*MAD) variance bands. A timing-only
      # failure repeats the complete timing window once; deterministic/resource
      # failures never retry.
      - name: Performance regression gate
        working-directory: engine
        env:
          RAYON_NUM_THREADS: 4
          RR_PERF_RUNNER_CONTRACT: github-hosted-ubuntu-24.04-x64-public-standard
        run: |
          mkdir -p ../bench-output
          cargo run --release --bin perfgate -- check \
            ../docs/performance/perf-baseline.json \
            ../bench-output/perf-current.json

      # Deep diagnostic sweeps are deliberately non-blocking: they include
      # noisier/machine-specific signals outside ADR-124's reviewed contract.
      - name: Deep benchmarks (informational)
        continue-on-error: true
        working-directory: engine
        run: |
          mkdir -p ../bench-output
          echo "== bench (1M queries, 20k titles, 5% broad) =="      | tee ../bench-output/bench.txt
          cargo run --release --bin bench    -- 1000000 20000 0.05   2>&1 | tee -a ../bench-output/bench.txt
          echo "== segbench (300k queries, 3k titles) =="            | tee ../bench-output/segbench.txt
          cargo run --release --bin segbench -- 300000 3000 0.0      2>&1 | tee -a ../bench-output/segbench.txt
          echo "== snapbench (200k queries) =="                      | tee ../bench-output/snapbench.txt
          cargo run --release --bin snapbench -- 200000             2>&1 | tee -a ../bench-output/snapbench.txt
          echo "== clusterbench (100k queries, 5k titles, K=8) =="    | tee ../bench-output/clusterbench.txt
          cargo run --release --bin clusterbench -- 100000 5000 8 0.05  2>&1 | tee -a ../bench-output/clusterbench.txt

      - name: Upload benchmark output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-output
          path: bench-output/
          if-no-files-found: ignore
          retention-days: 30

      # Backward-compatible manual trigger. The same exact 10M target also runs
      # weekly in soak.yml, with its logs/resource capture retained for 90 days.
      - name: Soak (10M queries, on-demand)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_soak }}
        working-directory: engine
        run: >
          cargo test --release --test stress
          soak::ten_million_queries_mixed_ops --
          --ignored --nocapture --exact

  # The distributed feature compiles a different dependency and cfg graph, and
  # shares no ordering requirement with the default/core lane. Keeping it on a
  # separate runner removes its release+LTO build from the serial critical path
  # while executing the exact same clippy and test commands as local check.sh.
  distributed-gate:
    name: distributed gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install pinned toolchain
        working-directory: engine
        run: rustc --version && cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
          # Reuse distributed dependency artifacts without letting this test
          # lane overwrite the production-bin cache shared by harness/release.
          shared-key: distributed
          save-if: false

      - name: check.sh (distributed lane)
        run: ./engine/check.sh --lane distributed

  # Preserve the established required-check context. Branch protection can keep
  # requiring `gate + benchmarks`; it turns green only when both code-gate lanes
  # succeed, even though they run concurrently.
  gate:
    name: gate + benchmarks
    needs: [core-gate, distributed-gate]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every code-gate lane
        env:
          CORE_RESULT: ${{ needs.core-gate.result }}
          DISTRIBUTED_RESULT: ${{ needs.distributed-gate.result }}
        run: |
          set -euo pipefail
          echo "core gate: $CORE_RESULT"
          echo "distributed gate: $DISTRIBUTED_RESULT"
          [[ "$CORE_RESULT" == "success" ]]
          [[ "$DISTRIBUTED_RESULT" == "success" ]]

  # The multi-machine harness (ADR-072, Distributed-v1 criterion 3): a fully secured
  # containerized cluster (3 durable shard nodes + handoff target + REST coordinator +
  # a 3-node control plane) driven through kill-and-recover, rolling restarts, a
  # coordinator restart, and a live handoff under load — every link crossing a real
  # container network boundary. Builds the bins natively (cached), wraps them in the
  # prebuilt runtime image, and runs deploy/harness.sh.
  harness:
    name: multi-machine harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Validate the PRODUCTION compose (deploy/compose.cluster.yml, ADR-081). The
      # harness below exercises compose.harness.yml, not this file, so without this it
      # has no CI coverage. `config` is a daemon-independent client-side parse (anchors,
      # env interpolation, volume/network refs); the fail-loud required-secret guards
      # need dummy values supplied, exactly as a real bring-up would. Fails fast.
      - name: Lint the production cluster compose
        run: >
          RR_CLUSTER_TOKEN=ci-lint RR_AUTH_TOKEN=ci-lint RR_CERT_DIR=./deploy/certs
          docker compose --project-directory . -f deploy/compose.cluster.yml config >/dev/null

      - name: Install pinned toolchain
        working-directory: engine
        run: rustc --version && cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
          # Separate cache from the gate job (different feature set). `shared-key`
          # (not `key`) so the RELEASE workflow — which builds the same distributed
          # bins — restores the cache this job saves on `main` pushes (ADR-098).
          shared-key: distributed

      - name: Build node binaries (distributed)
        working-directory: engine
        run: >
          cargo build --release --features distributed
          --bin server --bin shardserver --bin controlserver

      # On failure the harness's own cleanup trap dumps container logs BEFORE
      # tearing the stack down — a separate dump step here would run after the
      # teardown and see nothing.
      - name: Run the harness
        run: ./deploy/harness.sh --prebuilt engine/target/release

      # The production-compose smoke (ADR-098): behavioral coverage for
      # compose.cluster.yml on every PR (the lint above is parse-only). Reuses the
      # prebuilt image the harness just built — ~30-60s. The harness's EXIT trap has
      # already torn its stack down, so the ports are free.
      - name: Production-compose smoke (same prebuilt image)
        run: RR_IMAGE=reverse-rusty-harness:dev ./deploy/cluster-smoke.sh

  # The Helm chart (deploy/helm/reverse-rusty, ADR-084): lint + render across a value
  # matrix + validate every rendered manifest against the real Kubernetes 1.29 schemas
  # with kubeconform -strict (rejects unknown fields — catches a mistyped probe/field).
  # This is the authoritative gate for the chart: it is not Rust, so it lives here rather
  # than in check.sh, and renders with no cluster (daemon-independent, like the compose lint).
  helm-chart:
    name: helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install helm + kubeconform
        run: |
          set -euo pipefail
          curl -fsSL https://get.helm.sh/helm-v3.16.3-linux-amd64.tar.gz | tar xz
          sudo mv linux-amd64/helm /usr/local/bin/helm
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform
          curl -fsSL https://github.com/prometheus/prometheus/releases/download/v3.4.1/prometheus-3.4.1.linux-amd64.tar.gz | tar xz --strip-components=1 prometheus-3.4.1.linux-amd64/promtool
          sudo mv promtool /usr/local/bin/promtool
          helm version --short && kubeconform -v && promtool --version

      - name: helm lint
        run: helm lint deploy/helm/reverse-rusty

      - name: helm template + kubeconform (value matrix)
        run: |
          set -euo pipefail
          validate() {
            echo "== helm template $* =="
            helm template rr deploy/helm/reverse-rusty -n rrns "$@" \
              | kubeconform -strict -summary -kubernetes-version 1.29.0
          }
          validate
          validate --set shardCount=5
          validate --set controlPlane.enabled=false
          validate --set tls.enabled=false --set auth.enabled=false
          validate --set clusterToken.create=true --set clusterToken.value=x \
                   --set auth.create=true --set auth.value=y

      # Drift tripwires (Tier 5 M2, ADR-098): compose ≡ rendered chart on the
      # load-bearing topology facts, and crate version ≡ chart appVersion (the
      # release preflight adds the tag to this equation).
      - name: Topology parity (compose ≡ rendered chart)
        run: ./deploy/check-topology-parity.sh

      - name: Version drift (Cargo.toml == Chart appVersion)
        run: ./deploy/check-versions.sh

      # The shipped alert rules stay loadable (Tier 5 M3): promtool parses + validates
      # deploy/prometheus-alerts.yml, so the file operators load cannot rot silently.
      - name: Alert rules valid (promtool check rules)
        run: promtool check rules deploy/prometheus-alerts.yml
